<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familien-Apps</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#1d2b26;--muted:#5f716a;--line:#dbe4df;--accent:#1f8a62;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#111917;--surface:#1a2522;--ink:#e7efeb;--muted:#9fb2aa;--line:#2c3b36;--accent:#4cc795;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:14px}
h1{margin:0 0 8px;font-size:28px}
a.app{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:inherit;text-decoration:none}
a.app img{width:48px;height:48px;border-radius:12px}
a.app b{display:block}
a.app small{color:var(--muted)}
a.app:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Familien-Apps</h1>
  <a class="app" href="eiweiss/"><img src="eiweiss/icon-192.png" alt=""><span><b>Eiweiß-Tagebuch</b><small>Eintragen, was gegessen wurde</small></span></a>
</main>
</body>
</html>
