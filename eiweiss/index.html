<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eiweiß-Tagebuch</title>
<meta name="theme-color" content="#1f8a62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte fürs Handy. Oben der Tagesring mit Ampel, darunter große Kacheln zum Antippen, dann die Liste des Tages. Eintragen in einem Blatt von unten, zuerst in Stück. */
:root{
  --bg:#f3f6f4;
  --surface:#ffffff;
  --ink:#1d2b26;
  --muted:#5f716a;
  --line:#dbe4df;
  --accent:#1f8a62;
  --accent-soft:#dff2e9;
  --ok:#1f8a62;
  --near:#b07a00;
  --near-soft:#fbf0d2;
  --over:#c8323c;
  --over-soft:#fbe1e1;
  --font-display:"Fredoka","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111917; --surface:#1a2522; --ink:#e7efeb; --muted:#9fb2aa; --line:#2c3b36;
    --accent:#4cc795; --accent-soft:#1d3a2f; --ok:#33a676; --near:#b98a1a; --near-soft:#3a3018; --over:#e2566a; --over-soft:#3d1f24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111917; --surface:#1a2522; --ink:#e7efeb; --muted:#9fb2aa; --line:#2c3b36;
  --accent:#4cc795; --accent-soft:#1d3a2f; --ok:#33a676; --near:#b98a1a; --near-soft:#3a3018; --over:#e2566a; --over-soft:#3d1f24;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 110px;display:flex;flex-direction:column;gap:18px}

.daybar{display:flex;align-items:center;gap:8px}
.daybar h1{flex:1;margin:0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:26px;text-wrap:balance}
.daybar h1 small{display:block;font-family:var(--font-body);font-size:15px;color:var(--muted);font-weight:600}
.iconbtn{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:26px;display:grid;place-items:center}
.iconbtn:disabled{opacity:.3}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ring{position:relative;width:210px;height:210px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--ok);transition:stroke-dashoffset .4s ease}
.ring.near .bar{stroke:var(--near)}
.ring.over .bar{stroke:var(--over)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--font-display);font-weight:600;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.ring .unit{font-size:22px}
.zielbtn{margin-top:6px;border:none;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 13px;font-weight:700;font-size:16px}
.status{font-family:var(--font-display);font-weight:600;font-size:26px;text-align:center;color:var(--ok)}
.status.near{color:var(--near)}
.status.over{color:var(--over)}
.kcal{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;width:100%;padding-top:8px;border-top:1px solid var(--line)}
.wd{border:none;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:700}
.wd .col{position:relative;width:70%;height:54px;background:var(--bg);border-radius:6px;overflow:hidden}
.wd .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ok);border-radius:6px}
.wd .fill.near{background:var(--near)}
.wd .fill.over{background:var(--over)}
.wd .zl{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.7}
.wd.cur{color:var(--ink)}
.wd.cur .col{outline:2px solid var(--ink);outline-offset:1px}

h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:22px}
.section{display:flex;flex-direction:column;gap:10px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile .ic{font-size:32px;line-height:1}
.tile b{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:14px;font-weight:600}

.addbtn{width:100%;border:2px solid var(--accent);border-radius:18px;background:var(--surface);color:var(--accent);font-weight:800;font-size:20px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.addbtn span{font-size:26px;line-height:1}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:last-child{border-bottom:none}
.row .ic{font-size:26px;line-height:1;width:32px;text-align:center;flex:none}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.row .n small{color:var(--muted);font-size:14px}
.row .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:18px;color:var(--muted);text-align:center}
.meals{display:flex;flex-direction:column;gap:12px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mhead{display:flex;align-items:baseline;gap:10px;padding:12px 16px;background:var(--accent-soft)}
.mhead h3{flex:1;margin:0;font-family:var(--font-display);font-weight:600;font-size:19px}
.mhead span{font-weight:800;font-variant-numeric:tabular-nums}
.meal .row{border-bottom:1px solid var(--line)}
.madd{width:100%;border:none;background:none;padding:12px 16px;text-align:left;color:var(--accent);font-weight:800;font-size:16px}
.meal.none .mhead{background:var(--bg)}
.wrap[hidden]{display:none}
.golink{border:none;background:none;color:var(--accent);font-weight:800;font-size:17px;padding:4px 8px}
.daybar .spacer{width:52px;flex:none}
.range{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-weight:700;font-size:14px}
.kpi b{font-family:var(--font-display);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi.flag b{color:var(--over)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-body);font-size:11px;font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lim{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
.chart .b-ok{fill:var(--ok)} .chart .b-near{fill:var(--near)} .chart .b-over{fill:var(--over)}
.chart .sel{fill:none;stroke:var(--ink);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.pick{display:flex;align-items:center;gap:10px;min-height:44px;margin:0;font-weight:700}
.pick span{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:14px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.frow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:none}
.frow .ic{font-size:24px;width:30px;text-align:center;flex:none}
.frow .n{flex:1;min-width:0}
.frow .n b{display:block;font-size:16px;overflow-wrap:anywhere}
.frow .n small{color:var(--muted);font-size:14px}
.fbar{height:6px;border-radius:3px;background:var(--bg);margin:5px 0 3px}
.fbar i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.frow .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .v small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.drow{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:none;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.drow:last-child{border-bottom:none}
.drow .n{flex:1;min-width:0}
.drow .n b{display:block;font-size:16px}
.drow .n small{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.drow .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.drow .v small{display:block;font-size:13px;color:var(--over);font-weight:800}
.morebtn{width:100%;border:none;border-top:1px solid var(--line);background:none;padding:12px;color:var(--accent);font-weight:800;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segb{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 8px;font-weight:800;font-size:17px}
.segb.on{border-color:var(--accent);background:var(--accent-soft)}
.foot{color:var(--muted);font-size:14px;text-align:center}
.note{background:var(--over-soft);border-radius:14px;padding:10px 14px;font-size:15px}

.sheet{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;justify-content:flex-end;background:rgba(10,20,16,.45)}
.sheet.open{display:flex}
.panel{background:var(--bg);border-radius:24px 24px 0 0;max-height:94%;height:94%;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease}
.panel.short{height:auto}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}.ring .bar{transition:none}}
.phead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.phead .ic{font-size:30px;line-height:1}
.phead h3{flex:1;margin:0;font-family:var(--font-display);font-weight:600;font-size:22px;overflow-wrap:anywhere}
.pbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto}
.search{width:100%;font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.search:focus{border-color:var(--accent);outline:none}
.res{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.links{display:flex;flex-wrap:wrap;gap:10px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px}
.textbtn{border:none;background:none;color:var(--muted);font-weight:700;font-size:16px;text-decoration:underline;padding:6px 0;align-self:center}
.qlabel{font-family:var(--font-display);font-weight:600;font-size:22px;text-align:center;margin:0}
.amount{display:flex;align-items:center;gap:12px}
.amount input,.amount output{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-size:44px;font-weight:600;padding:8px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;display:block}
.amount input:focus{border-color:var(--accent);outline:none}
.step{width:72px;height:72px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:34px;font-weight:800;flex:none}
.sub{color:var(--muted);text-align:center;margin:-6px 0 0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:800;font-size:17px}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.result{background:var(--accent-soft);border-radius:18px;padding:14px;text-align:center}
.result b{display:block;font-family:var(--font-display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.result span{font-weight:700}
.result.near{background:var(--near-soft)}
.result.over{background:var(--over-soft)}
.result.over span{color:var(--over)}
.primary{width:100%;border:none;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:22px;padding:18px}
:root[data-theme="dark"] .primary{color:#0d1a15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#0d1a15}}
.danger{width:100%;border:1px solid var(--over);color:var(--over);background:none;border-radius:18px;font-weight:800;font-size:18px;padding:14px}
label{font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:6px}
.field{font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);width:100%}
.field:focus{border-color:var(--accent);outline:none}
.hint{color:var(--muted);font-size:15px;margin:0;text-align:center}
.box[hidden]{display:none}
.box{border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:14px;font-weight:700;max-width:calc(100% - 32px)}
.toast.show{display:flex}
.toast button{border:none;background:none;color:var(--accent);font-weight:800;text-decoration:underline}
.ro .addbtn,.ro .tiles{opacity:.5;pointer-events:none}
.login{display:flex;flex-direction:column;gap:16px;padding-top:12vh}
.login h1{margin:0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:32px}
.login form{display:flex;flex-direction:column;gap:14px}
.linkbtn{border:none;background:none;color:var(--accent);font-weight:800;text-decoration:underline;padding:0;font-size:inherit}
</style>
</head>
<body>
<div class="wrap" id="loginView" hidden>
  <div class="login">
    <h1>Eiweiß-Tagebuch</h1>
    <p class="hint" id="lIntro">Bitte melde dich an.</p>
    <form id="loginForm" novalidate>
      <label for="lEmail">E-Mail<input class="field" id="lEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></label>
      <label for="lPw">Passwort<input class="field" id="lPw" type="password" autocomplete="current-password"></label>
      <button class="primary" id="lBtn" type="submit">Anmelden</button>
      <p class="hint" id="lMsg" role="status"></p>
    </form>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="daybar">
    <button class="iconbtn" id="prev" aria-label="Vorheriger Tag">‹</button>
    <h1 id="dayTitle">Heute</h1>
    <button class="iconbtn" id="next" aria-label="Nächster Tag">›</button>
  </div>

  <div class="summary">
    <div class="ring" id="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"></circle>
        <circle class="bar" id="ringBar" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
      </svg>
      <div class="mid">
        <div class="big" id="total">0<span class="unit"> g</span></div>
        <button class="zielbtn" id="zielBtn">Grenze 25 g</button>
      </div>
    </div>
    <div class="status" id="status">Noch 25 g frei</div>
    <div class="kcal" id="kcal">0 kcal</div>
    <div class="week" id="week"></div>
    <button class="golink" id="goOv">Übersicht ansehen ›</button>
  </div>

  <div id="note" class="note" hidden></div>

  <div class="section">
    <h2>Was hast du gegessen?</h2>
    <div class="tiles" id="favs"></div>
    <button class="addbtn" id="addBtn"><span>+</span> Anderes Essen suchen</button>
  </div>

  <div class="section">
    <h2 id="listTitle">Heute gegessen</h2>
    <div class="meals" id="meals"></div>
  </div>

  <p class="foot" id="foot">Lädt …</p>
</div>

<div class="wrap" id="ovView" hidden>
  <div class="daybar">
    <button class="iconbtn" id="ovBack" aria-label="Zurück zum Tag">‹</button>
    <h1>Übersicht<small id="ovSub"></small></h1>
    <span class="spacer" aria-hidden="true"></span>
  </div>
  <div class="range" role="radiogroup" aria-label="Zeitraum">
    <button class="segb" data-range="7" role="radio">7 Tage</button>
    <button class="segb" data-range="30" role="radio">30 Tage</button>
    <button class="segb" data-range="90" role="radio">3 Monate</button>
  </div>
  <div id="ovBody" class="section"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel" id="panel">
    <div class="phead">
      <span class="ic" id="sheetIcon" aria-hidden="true"></span>
      <h3 id="sheetTitle">Essen suchen</h3>
      <button class="iconbtn" id="closeSheet" aria-label="Schließen">✕</button>
    </div>
    <div class="pbody" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastBtn" hidden>Rückgängig</button></div>

function showResults(query){
  const box = $("results"); if (!box) return;
  const words = norm(query.trim()).split(/\s+/).filter(Boolean);
  const h = history();
  if (!words.length) { box.innerHTML = resHtml(favorites(h, sheetMeal)); return; }
  const list = allFoods().filter(f => { const n = norm(f.name); return words.every(w => n.includes(w)); });
  list.sort((a, b) => {
    const as = norm(a.name).startsWith(words[0]) ? 1 : 0, bs = norm(b.name).startsWith(words[0]) ? 1 : 0;
    if (as !== bs) return bs - as;
    const af = h.freq[a.name] || 0, bf = h.freq[b.name] || 0;
    if (af !== bf) return bf - af;
    return a.name.localeCompare(b.name, "de");
  });
  box.innerHTML = list.length ? resHtml(list.slice(0, 50)) : '<p class="hint">Nichts gefunden. Probier ein anderes Wort oder lege es unten neu an.</p>';

let amt = null;
function openAmount(food, editItem){
  if (state.readOnly) return;
  const a = defaultAmount(food);
  amt = {food, mode: a.mode, stk: a.stk || 1, g: a.g, portion: a.portion, last: a.last, editId: null};
  if (!sheetMeal) sheetMeal = defaultMeal();
  if (editItem) {
    amt.editId = editItem.id;
    sheetMeal = editItem.meal || null;
    if (editItem.stk && amt.portion) { amt.mode = "stk"; amt.stk = num(editItem.stk); }
    else { amt.mode = "g"; amt.g = num(editItem.g) || 100; }
  }
  drawAmount();
}
function grams(){ return amt.mode === "stk" ? amt.stk * amt.portion : Math.max(0, amt.g || 0); }
function drawAmount(){
  sheetMode = "amount";
  const f = amt.food, edit = !!amt.editId;
  let html = mealSeg();
  if (amt.mode === "stk") {
    html += '<p class="qlabel">Wie viele Stück?</p>' +
      '<div class="amount"><button class="step" id="minus" aria-label="Weniger">−</button><output id="stkOut" aria-live="polite"></output><button class="step" id="plus" aria-label="Mehr">+</button></div>' +
      '<p class="sub">1 Stück = ' + esc(fmt(amt.portion)) + " g</p>" +
      '<div class="chips">' + [0.5, 1, 2, 3].map(s => '<button class="chip" data-stk="' + s + '">' + fmtStk(s) + "</button>").join("") + "</div>";
  } else {
    const chips = [];
    if (amt.last && amt.last.g > 0) chips.push([amt.last.g, "Wie letztes Mal · " + fmt(amt.last.g) + " g"]);
    [25, 50, 100, 150, 200].forEach(v => { if (!chips.some(c => Math.abs(c[0] - v) < 0.01)) chips.push([v, v + " g"]); });
    html += '<p class="qlabel">Wie viel Gramm?</p>' +
      '<div class="amount"><button class="step" id="minus" aria-label="10 Gramm weniger">−</button><input id="g" inputmode="decimal" enterkeyhint="done" aria-label="Gramm"><button class="step" id="plus" aria-label="10 Gramm mehr">+</button></div>' +
      '<p class="sub">Tipp: Teller auf die Waage stellen</p>' +
      '<div class="chips">' + chips.map(c => '<button class="chip" data-g="' + c[0] + '">' + esc(c[1]) + "</button>").join("") + "</div>";
  }
  html += '<div class="result" id="calc"></div>' +
    '<button class="primary" id="save">' + (edit ? "Ändern" : "Eintragen") + "</button>";
  if (amt.mode === "stk") html += '<button class="textbtn" id="toG">Lieber in Gramm eingeben</button>';
  else html += (amt.portion ? '<button class="textbtn" id="toStk">In Stück eingeben</button>' : '<button class="textbtn" id="setPortion">Gibt es das in Stücken?</button>') +
    '<div class="box" id="portionBox" hidden><label for="pv">Wie viel wiegt 1 Stück? (Gramm)<input class="field" id="pv" inputmode="decimal" placeholder="z. B. 80"></label><button class="ghost" id="pSave">Speichern</button></div>';
  html += '<button class="textbtn" id="editFood">Werte von diesem Lebensmittel ändern</button>';
  if (edit) html += '<button class="danger" id="del">Löschen</button>';
  openSheet(cleanName(f.name), html, {icon: iconFor(f.name)});
  if (amt.mode === "g") {
    $("g").value = fmt(amt.g);
    $("g").addEventListener("input", () => { const v = num($("g").value); amt.g = isFinite(v) ? v : 0; calcAmount(true); });
  }
  calcAmount();
}
function calcAmount(fromInput){
  const g = grams();
  if (amt.mode === "stk") $("stkOut").textContent = fmtStk(amt.stk);
  else if (!fromInput) $("g").value = fmt(g);
  const e = g * amt.food.p / 100;
  const k = state.cur, z = zielOf(k);
  let base = totals(k).e;
  if (amt.editId) { const it = ((state.days[k] || {}).items || []).find(x => x.id === amt.editId); if (it) base -= num(it.eiweiss) || 0; }
  const after = base + e, lv = level(after, z);
  $("calc").className = "result " + lv;
  $("calc").innerHTML = "<b>" + esc(fmt(e)) + " g Eiweiß</b><span>" +
    (lv === "over" ? "Danach " + esc(fmt(after - z)) + " g zu viel" : z - after < 0.05 ? "Danach ist die Grenze erreicht" : "Danach noch " + esc(fmt(z - after)) + " g frei") + "</span>";
  document.querySelectorAll(".chip").forEach(c => {
    const on = amt.mode === "stk" ? Math.abs(num(c.dataset.stk) - amt.stk) < 0.01 : Math.abs(num(c.dataset.g) - g) < 0.01;
    c.classList.toggle("on", on);
  });
}
function stepAmount(dir){
  if (amt.mode === "stk") {
    if (dir > 0) amt.stk = amt.stk < 1 ? 1 : amt.stk + 1;
    else amt.stk = amt.stk > 1 ? amt.stk - 1 : 0.5;
  } else amt.g = Math.max(0, Math.round((amt.g || 0) + dir * 10));
  calcAmount();
}
function saveAmount(){
  const g = Math.round(grams() * 10) / 10;
  if (!(g > 0)) { toast("Bitte eine Menge eingeben."); return; }
  const fields = itemFields(amt.food, g, amt.mode === "stk" ? amt.stk : null);
  fields.meal = sheetMeal || null;
  if (amt.editId) updateItem(state.cur, amt.editId, fields);
  else addItem(state.cur, Object.assign({id: uid(), name: amt.food.name, t: Date.now()}, fields));
  const msg = (amt.editId ? "Geändert: " : "Eingetragen: ") + cleanName(amt.food.name) + (sheetMeal ? " · " + mealLabel(sheetMeal) : "");
  closeSheet(); toast(msg);
}

  saveFoodRow({name: amt.food.name, stueck: v});

}

document.addEventListener("click", e => {

  const od = e.target.closest("[data-ovday]");

  const op = e.target.closest("[data-openday]");
  if (op) { state.cur = op.getAttribute("data-openday"); location.hash = ""; return; }
  const ob = e.target.closest("button");
  if (ob && ob.id === "goOv") { location.hash = "uebersicht"; return; }
  if (ob && ob.id === "ovBack") { location.hash = ""; return; }
  if (ob && ob.id === "ovMore") { ovAllFoods = !ovAllFoods; renderOverview(); return; }
  const day = e.target.closest("[data-day]");
  if (day) { state.cur = day.dataset.day; render(); return; }
  const fb = e.target.closest("[data-food]");
  if (fb) { const f = findFood(fb.dataset.food); if (f) openAmount(f); return; }
  const am = e.target.closest("[data-addmeal]");
  if (am) { openAdd(am.dataset.addmeal); return; }
  const mb = e.target.closest("[data-meal]");
  if (mb) {
    sheetMeal = mb.dataset.meal;
    document.querySelectorAll(".segb").forEach(b => { const on = b.dataset.meal === sheetMeal; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
    return;
  }
  const ib = e.target.closest("[data-item]");
  if (ib) {
    const it = ((state.days[state.cur] || {}).items || []).find(x => x.id === ib.dataset.item);
    if (!it || state.readOnly) return;
    if (it.manual) openManual(it);
    else { const f = findFood(it.name); openAmount({name: it.name, p: num(it.p100), k: num(it.k100), portion: f ? f.portion : null}, it); }
    return;
  }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.stk) { amt.stk = num(t.dataset.stk); calcAmount(); return; }
  if (t.dataset.g) { amt.g = num(t.dataset.g); calcAmount(); return; }
  switch (t.id) {
    case "goManual": openManual(); break;
    case "editFood": openEditFood(amt.food); break;
    case "efSave": saveEditFood(); break;
    case "efHide": hideFood(); break;
    case "kontoBtn": openKonto(); break;
    case "pwSave": savePw(); break;
    case "logout": closeSheet(); sb.auth.signOut(); break;
    case "goNew": openNewFood($("q") ? $("q").value.trim() : ""); break;
    case "minus": stepAmount(-1); break;
    case "plus": stepAmount(1); break;
    case "toG": amt.mode = "g"; amt.g = Math.round(grams() * 10) / 10; drawAmount(); break;
    case "toStk": amt.mode = "stk"; amt.stk = Math.max(0.5, Math.round(amt.g / amt.portion * 2) / 2); drawAmount(); break;
    case "setPortion": $("portionBox").hidden = false; t.hidden = true; try { $("pv").focus(); } catch (x) {} break;
    case "pSave": savePortion(); break;
    case "save": saveAmount(); break;
    case "del": { const id = t.dataset.edit || (amt && amt.editId); closeSheet(); removeItem(state.cur, id); break; }
    case "mSave": saveManual(t.dataset.edit || null); break;
    case "nSave": saveNewFood(); break;
    case "zMinus": $("zV").value = fmt(Math.max(1, (num($("zV").value) || 0) - 1)); break;
    case "zPlus": $("zV").value = fmt((num($("zV").value) || 0) + 1); break;
    case "zDay": saveZiel(false); break;
    case "zAll": saveZiel(true); break;
  }
});

async function fetchAll(build){
  const out = [], size = 1000;
  for (let from = 0; ; from += size) {
    const { data, error } = await build().range(from, from + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) break;
  }
  return out;
}
async function loadAll(){
  const since = addDays(keyOf(new Date()), -400);
  const [rows, tage, foods, sets] = await Promise.all([
    fetchAll(() => sb.from("eiweiss_eintraege").select("*").gte("datum", since).order("datum").order("t").order("id")),
    fetchAll(() => sb.from("eiweiss_tage").select("*").gte("datum", since).order("datum")),
    fetchAll(() => sb.from("eiweiss_lebensmittel").select("*").order("name")),
    fetchAll(() => sb.from("eiweiss_einstellungen").select("*").order("schluessel"))
  ]);
  const days = {};
  rows.forEach(r => { const k = r.datum; (days[k] = days[k] || {date: k, ziel: null, items: []}).items.push(rowToItem(r)); });
  tage.forEach(t => { (days[t.datum] = days[t.datum] || {date: t.datum, ziel: null, items: []}).ziel = num(t.ziel); });
  const fr = {}; foods.forEach(f => fr[f.name] = f);
  const st = {ziel: 25}; sets.forEach(x => { if (x.schluessel === "ziel" && num(x.wert) > 0) st.ziel = num(x.wert); });
  state.days = days; state.foodRows = fr; state.settings = st; foodsCache = null;
  $("note").hidden = true;
  cacheSave(); render();
}
function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("eiweiss")
    .on("postgres_changes", {event: "*", schema: "public", table: "eiweiss_eintraege"}, p => {
      if (p.eventType === "DELETE") { if (p.old && p.old.id) dropItem(p.old.id); }
      else if (p.new && p.new.id) placeItem(p.new.datum, rowToItem(p.new));
      cacheSave(); render();
    })
    .on("postgres_changes", {event: "*", schema: "public", table: "eiweiss_tage"}, p => {
      if (p.new && p.new.datum) { ensureDay(p.new.datum).ziel = num(p.new.ziel); render(); }
    })
    .on("postgres_changes", {event: "*", schema: "public", table: "eiweiss_lebensmittel"}, p => {
      if (p.new && p.new.name) { state.foodRows = Object.assign({}, state.foodRows, {[p.new.name]: p.new}); foodsCache = null; render(); }
    })
    .on("postgres_changes", {event: "*", schema: "public", table: "eiweiss_einstellungen"}, p => {
      if (p.new && p.new.schluessel === "ziel" && num(p.new.wert) > 0) { state.settings = Object.assign({}, state.settings, {ziel: num(p.new.wert)}); render(); }
    })
    .subscribe();
}
async function afterLogin(session){
  const email = String(session && session.user && session.user.email || "").toLowerCase();
  const { data, error } = await sb.from("mitglieder").select("email").limit(1);
  if (error) { if (!state.email) showLogin("Die Verbindung klappt gerade nicht. Bitte Internet prüfen."); return; }
  if (!data || !data.length) { await sb.auth.signOut(); showLogin("Diese Adresse hat noch keinen Zugriff. Bitte Thomas fragen."); return; }
  state.email = email;
  showView();
  try { await loadAll(); }
  catch (e) { try { console.warn(e); } catch (x) {} $("note").hidden = false; $("note").textContent = "Die Daten konnten nicht geladen werden. Bitte Internet prüfen."; }
  subscribe();
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("lEmail").value.trim().toLowerCase(), pw = $("lPw").value;
  if (!email || !pw) { $("lMsg").textContent = "Bitte E-Mail und Passwort eingeben."; return; }
  $("lBtn").disabled = true; $("lMsg").textContent = "Melde an …";
  const { data, error } = await sb.auth.signInWithPassword({email, password: pw});
  $("lBtn").disabled = false;
  if (error) { $("lMsg").textContent = /invalid/i.test(error.message || "") ? "E-Mail oder Passwort stimmt nicht." : "Anmelden hat nicht geklappt. Bitte Internet prüfen."; return; }
  $("lPw").value = ""; $("lMsg").textContent = "";
  await afterLogin(data.session);
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !state.email) return;
  const t = keyOf(new Date());
  if (t !== state.today) { if (state.cur === state.today) state.cur = t; state.today = t; render(); }
  loadAll().catch(() => {});
});
async function start(){
  if (!window.supabase || typeof window.supabase.createClient !== "function") { showLogin("Die App konnte nicht geladen werden. Bitte Internet prüfen und neu öffnen."); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, storageKey: "familie-apps-auth"}});
  sb.auth.onAuthStateChange(ev => {
    if (ev === "SIGNED_OUT") {
      cacheClear(); state.email = ""; state.days = {}; state.foodRows = {}; foodsCache = null;
      if (channel) { sb.removeChannel(channel); channel = null; }
      if ($("loginView").hidden) showLogin();
    }
  });
  const { data } = await sb.auth.getSession();
  const session = data && data.session;
  if (!session) { cacheClear(); showLogin(); return; }
  if (cacheLoad()) { state.email = String(session.user.email || "").toLowerCase(); showView(); }
  await afterLogin(session);
}
start();
})();
</script>
